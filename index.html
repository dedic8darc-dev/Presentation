<title>Will AI Take Your Job?</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: one infinite drafting canvas; a camera glides over it, statements sit in screen space above the world. */
:root{
  --ink:#0b0c0a;          /* canvas, near-black with a faint olive bias */
  --paper:#efe9dc;        /* warm white line art and type */
  --paper-dim:rgba(239,233,220,.46);
  --paper-faint:rgba(239,233,220,.22);
  --lime:#c8f53b;         /* AI, discoveries, key words — used sparingly */
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --gx:max(28px,4.2vw);
  --u:1;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#bg,#world{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;pointer-events:none}

/* ---------- world line art ---------- */
#world path,#world line,#world circle{vector-effect:non-scaling-stroke;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hand{stroke:var(--paper);stroke-width:calc(var(--u)*2.5px)}
.hand-tex{stroke:var(--paper);stroke-width:calc(var(--u)*1px);opacity:.28}
.perfect{stroke:var(--paper);stroke-width:calc(var(--u)*2.5px)}
.trail{stroke:var(--lime);stroke-width:calc(var(--u)*3.2px)}
.guide{stroke:var(--lime);stroke-width:calc(var(--u)*1px);opacity:.5}
.cons{stroke:var(--paper);stroke-width:calc(var(--u)*1px);opacity:.26}
.dash{stroke-dasharray:calc(var(--u)*4px) calc(var(--u)*5px)}
.ann{stroke:var(--lime);stroke-width:calc(var(--u)*1.2px)}
.tick{stroke:var(--paper);stroke-width:calc(var(--u)*1px);opacity:.3}
#world .fill-lime{fill:var(--lime);stroke:none}
#world .fill-paper{fill:var(--paper);stroke:none}
#world .ring{stroke:var(--lime);stroke-width:calc(var(--u)*1.2px)}
#world .ring-paper{stroke:var(--paper);stroke-width:calc(var(--u)*1.2px)}
.mono{font-family:var(--mono);font-size:13.5px;letter-spacing:.14em;fill:var(--lime);font-weight:500}
.mono.p{fill:var(--paper);opacity:.55}
.lbl{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.2em;fill:var(--paper);font-variation-settings:"wdth" 112}
.lbl .d{fill:var(--paper-dim)}
.lbl .l{fill:var(--lime)}

/* ---------- screen-space typography ---------- */
#q,.qtwin{position:absolute;left:0;top:0;transform-origin:0 0;
  font-family:var(--display);font-weight:850;font-variation-settings:"wdth" 108;
  font-size:clamp(40px,8.4vw,170px);line-height:.9;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;opacity:0}
.stm{position:absolute;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 110;
  text-transform:uppercase;line-height:1;letter-spacing:.005em;text-wrap:balance}
.stm .line{display:block}
.stm .w{display:inline-block;margin-right:.24em;opacity:0;will-change:transform,opacity}
.stm .hl{color:var(--lime)}
.low{left:var(--gx);right:var(--gx);bottom:clamp(26px,8vh,100px);font-size:clamp(26px,4.3vw,92px)}
.low.big{font-size:clamp(30px,5.8vw,124px)}
.low.mid{font-size:clamp(22px,3.4vw,74px)}
#world .head{fill:var(--paper);stroke:none}
#world path.cart{vector-effect:none;fill:none;stroke:currentColor;stroke-width:var(--csw,2);stroke-linecap:round;stroke-linejoin:round}
.beam{stroke:var(--lime);stroke-width:calc(var(--u)*2.2px)}
.side{left:60%;right:var(--gx);top:50%;transform:translateY(-50%);font-size:clamp(28px,5vw,104px)}
.qm{display:inline-block;margin-left:-.2em;color:var(--lime);opacity:0}
#scrim{position:absolute;left:0;right:0;bottom:0;height:46vh;opacity:0;
  background:linear-gradient(to top,rgba(11,12,10,.92) 0%,rgba(11,12,10,.7) 45%,rgba(11,12,10,0) 100%)}
.corner{position:absolute;top:max(22px,3vh);right:var(--gx);text-align:right;font-family:var(--mono);
  font-size:clamp(10px,.74vw,15px);letter-spacing:.18em;color:var(--paper-dim);text-transform:uppercase;line-height:1.9;opacity:0}
.corner b{font-weight:500;color:var(--paper)}
#chap{transition:opacity .6s ease}
#hint{position:absolute;left:0;right:0;bottom:7vh;text-align:center;font-family:var(--mono);font-size:12px;
  letter-spacing:.24em;color:var(--paper-dim);text-transform:uppercase}
#hud{position:absolute;right:var(--gx);bottom:max(18px,2.4vh);display:flex;gap:14px;align-items:center;
  opacity:0;transition:opacity .4s ease;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--paper-dim)}
#hud.on{opacity:1}
#hud .grp{display:flex;gap:4px}
#hud i{display:block;width:14px;height:3px;background:var(--paper-faint)}
#hud i.done{background:var(--paper-dim)}
#hud i.now{background:var(--lime)}
#help{position:absolute;left:var(--gx);bottom:max(18px,2.4vh);font-family:var(--mono);font-size:12px;line-height:1.9;
  letter-spacing:.08em;color:var(--paper-dim);background:rgba(11,12,10,.86);padding:16px 20px;border:1px solid var(--paper-faint)}
#help b{color:var(--paper);font-weight:500;display:inline-block;min-width:11ch}
</style>

<canvas id="bg"></canvas>

</div>

<script>
(() => {
'use strict';
/* ================================================================
   Helpers
   ================================================================ */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (v, a, b) => clamp((v - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  linear: t => t,
  in: t => t * t * t,
  out: t => 1 - Math.pow(1 - t, 3),
  outQuart: t => 1 - Math.pow(1 - t, 4),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, str, cls, anchor = 'start') {
  const t = el('text', { x, y, class: cls, 'text-anchor': anchor }, parent);
  t.textContent = str;
  return t;
}
const f2 = n => n.toFixed(2);

/* A polyline we can draw partially: d(t0, t1) returns the path from fraction t0 to t1 of its length. */
class Line {
  constructor(pts) {
    this.p = pts; this.c = [0];
    for (let i = 1; i < pts.length; i++)
      this.c.push(this.c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    this.L = this.c[this.c.length - 1];
  }
  at(t) {
    const d = clamp(t) * this.L, c = this.c;
    let lo = 0, hi = c.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= d) lo = m; else hi = m; }
    const k = c[hi] - c[lo] ? (d - c[lo]) / (c[hi] - c[lo]) : 0;
    const a = this.p[lo], b = this.p[hi];
    return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lo];
  }
  d(t0, t1) {
    if (t1 <= t0 + 1e-5) return '';
    const a = this.at(t0), b = this.at(t1);
    let s = 'M' + f2(a[0]) + ' ' + f2(a[1]);
    for (let i = a[2] + 1; i <= b[2]; i++) s += 'L' + f2(this.p[i][0]) + ' ' + f2(this.p[i][1]);
    return s + 'L' + f2(b[0]) + ' ' + f2(b[1]);
  }
  last() { return this.p[this.p.length - 1]; }
}
/* Catmull-Rom smoothing through hand-placed points. */
function smooth(P, n = 14) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push(P[P.length - 1].slice());
  return out;
}
/* Subtle hand tremor: tiny perpendicular offsets. */
function tremor(pts, amp, seed) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    const n = amp * (Math.sin(i * .37 + seed) * .6 + Math.sin(i * 1.13 + seed * 2.1) * .4);
    return [p[0] - dy / l * n, p[1] + dx / l * n];
  });
}
const circlePts = (cx, cy, r, n = 360, a0 = -Math.PI / 2) =>
  Array.from({ length: n + 1 }, (_, i) => { const a = a0 + TAU * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });

/* ================================================================
   World geometry
   ================================================================ */
const cam = $('#cam');
const G = name => el('g', { id: name }, cam);

/* ---------- Slide 1: the human circle at (0,0) ---------- */
const R = 180, TH0 = -2.2, GAP = .115, HN = 240;
const handPts = [];
for (let i = 0; i < HN; i++) {
  const u = i / (HN - 1), th = TH0 + u * (TAU - GAP);
  const r = R * (1 + .024 * Math.sin(2 * th + .6) + .011 * Math.sin(3 * th + 2.1) + .005 * Math.sin(7 * th + .3))
            - 6.5 * u * u * u + .7 * Math.sin(u * 97);
  handPts.push([r * Math.cos(th) * 1.022, r * Math.sin(th)]);
}
const hand = new Line(handPts);
const handTex = new Line(handPts.map((p, i) => [p[0] + .9 * Math.sin(i * .21), p[1] + .7 * Math.cos(i * .17)]));
// pen speed varies naturally along the stroke
const penF = p => clamp(E.inOutSine(p) + .03 * Math.sin(TAU * p * 3) * Math.sin(Math.PI * p));

// measurements used by the annotations
const cen = handPts.reduce((a, p) => [a[0] + p[0] / HN, a[1] + p[1] / HN], [0, 0]);
const dists = handPts.map(p => Math.hypot(p[0] - cen[0], p[1] - cen[1]));
const Rm = dists.reduce((a, b) => a + b, 0) / HN;
let iMax = 0, iMin = 0;
for (let i = 30; i < HN - 30; i++) { if (dists[i] > dists[iMax] || !iMax) iMax = i; if (dists[i] < dists[iMin] || !iMin) iMin = i; }
const P0 = handPts[0], PN = handPts[HN - 1];
const gapMid = [(P0[0] + PN[0]) / 2, (P0[1] + PN[1]) / 2];
const gapD = Math.hypot(P0[0] - PN[0], P0[1] - PN[1]);
const xs = handPts.map(p => p[0]), ys = handPts.map(p => p[1]);
const bb = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
const bbc = [(bb.x0 + bb.x1) / 2, (bb.y0 + bb.y1) / 2];
const ovality = (bb.x1 - bb.x0) / (bb.y1 - bb.y0);
const dir = i => { const p = handPts[i]; const l = Math.hypot(p[0] - cen[0], p[1] - cen[1]); return [(p[0] - cen[0]) / l, (p[1] - cen[1]) / l]; };

const gHand = G('hand');
const handTexEl = el('path', { class: 'hand-tex' }, gHand);
const handEl = el('path', { class: 'hand' }, gHand);

// click 4: annotations
const gAnn = G('ann');
const idealLine = new Line(circlePts(cen[0], cen[1], Rm, 240, TH0 + .2));
const idealEl = el('path', { class: 'cons dash' }, gAnn);
function radialMark(i, sign) {
  const d = dir(i), p = handPts[i];
  const a = [cen[0] + d[0] * Rm, cen[1] + d[1] * Rm];
  const b = [p[0] + d[0] * 46, p[1] + d[1] * 46];
  const ln = el('line', { class: 'ann', x1: a[0], y1: a[1], x2: a[0], y2: a[1] }, gAnn);
  const dot = el('circle', { class: 'fill-lime', cx: p[0], cy: p[1], r: 2.4 }, gAnn);
  const dv = dists[i] - Rm;
  const t = txt(gAnn, b[0] + d[0] * 10, b[1] + d[1] * 10 + 4, (dv > 0 ? '+' : '−') + Math.abs(dv).toFixed(1), 'mono', d[0] < 0 ? 'end' : 'start');
  return { ln, dot, t, a, b };
}
const mMax = radialMark(iMax), mMin = radialMark(iMin);
const gapRing = el('circle', { class: 'ann dash', cx: gapMid[0], cy: gapMid[1], r: 19 }, gAnn);
const gd0 = [gapMid[0] - cen[0], gapMid[1] - cen[1]], gdl = Math.hypot(...gd0);
const gapLbl = txt(gAnn, gapMid[0] + gd0[0] / gdl * 34 - 4, gapMid[1] + gd0[1] / gdl * 34 - 6, 'GAP Δ ' + gapD.toFixed(1), 'mono', 'end');

// click 5: more imperfections, one after another
const gMarks = G('marks');
const marks = [];
{ // m1 ovality: the two axes
  const g = el('g', {}, gMarks);
  const h = new Line([[bb.x0 - 22, bbc[1]], [bb.x1 + 22, bbc[1]]]), v = new Line([[bbc[0], bb.y0 - 22], [bbc[0], bb.y1 + 22]]);
  const he = el('path', { class: 'cons' }, g), ve = el('path', { class: 'cons' }, g);
  const t = txt(g, bbc[0] + 10, bb.y1 + 40, 'OVALITY ' + ovality.toFixed(3) + ' : 1', 'mono');
  marks.push(p => { he.setAttribute('d', h.d(0, E.out(seg(p, 0, .6)))); ve.setAttribute('d', v.d(0, E.out(seg(p, .2, .8)))); t.style.opacity = seg(p, .5, 1); });
}
{ // m2 centre drift: centroid vs bounding-box centre
  const g = el('g', {}, gMarks);
  const cross = (c, cls) => { el('line', { class: cls, x1: c[0] - 7, y1: c[1], x2: c[0] + 7, y2: c[1] }, g); el('line', { class: cls, x1: c[0], y1: c[1] - 7, x2: c[0], y2: c[1] + 7 }, g); };
  cross(bbc, 'cons'); cross(cen, 'ann');
  const dc = Math.hypot(cen[0] - bbc[0], cen[1] - bbc[1]);
  const t = txt(g, cen[0] + 14, cen[1] + 26, 'CENTRE Δ ' + dc.toFixed(1), 'mono');
  marks.push(p => { g.style.opacity = E.out(seg(p, 0, .6)); t.style.opacity = seg(p, .4, 1); });
}
{ // m3 pen speed: ticks at equal time steps land at unequal distances
  const g = el('g', {}, gMarks); const ticks = [];
  for (let k = 1; k < 28; k++) {
    const t = penF(k / 28), a = hand.at(t), b = hand.at(Math.min(1, t + .002));
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = dy / l, ny = -dx / l;
    const s = (a[0] - cen[0]) * nx + (a[1] - cen[1]) * ny > 0 ? 1 : -1;
    ticks.push(el('line', { class: 'ann', x1: a[0] + nx * s * 6, y1: a[1] + ny * s * 6, x2: a[0] + nx * s * 16, y2: a[1] + ny * s * 16 }, g));
  }
  const lp = hand.at(penF(5 / 28)), ld = [lp[0] - cen[0], lp[1] - cen[1]], ll = Math.hypot(...ld);
  const t = txt(g, lp[0] + ld[0] / ll * 34, lp[1] + ld[1] / ll * 34, 'PEN SPEED', 'mono', ld[0] < 0 ? 'end' : 'start');
  marks.push(p => { ticks.forEach((e, i) => e.style.opacity = seg(p, i / ticks.length * .7, i / ticks.length * .7 + .2)); t.style.opacity = seg(p, .5, 1); });
}
{ // m4 wobble: bracket the bumpiest stretch
  let best = 60, bestV = -1;
  for (let i = 40; i < HN - 70; i++) {
    let v = 0; for (let j = i; j < i + 26; j++) v += Math.abs(dists[j + 1] - 2 * dists[j] + dists[j - 1]);
    if (v > bestV) { bestV = v; best = i; }
  }
  const g = el('g', {}, gMarks);
  const arc = []; for (let j = best; j <= best + 26; j++) { const d = dir(j), p = handPts[j]; arc.push([p[0] + d[0] * 16, p[1] + d[1] * 16]); }
  const al = new Line(arc), ae = el('path', { class: 'ann' }, g);
  const mid = best + 13, md = dir(mid), mp = handPts[mid];
  const t = txt(g, mp[0] + md[0] * 34, mp[1] + md[1] * 34 + 4, 'WOBBLE', 'mono', md[0] < 0 ? 'end' : 'start');
  marks.push(p => { ae.setAttribute('d', al.d(0, E.out(seg(p, 0, .6)))); t.style.opacity = seg(p, .4, 1); });
}
{ // m5 start ≠ end
  const g = el('g', {}, gMarks);
  const s = el('circle', { class: 'ring-paper', cx: P0[0], cy: P0[1], r: 5 }, g);
  const e = el('circle', { class: 'fill-lime', cx: PN[0], cy: PN[1], r: 3.6 }, g);
  const t1 = txt(g, P0[0] + 6, P0[1] - 26, 'START', 'mono p');
  const t2 = txt(g, PN[0] + 14, PN[1] + 16, 'END', 'mono');
  marks.push(p => { s.style.opacity = seg(p, 0, .4); e.style.opacity = seg(p, .3, .7); t1.style.opacity = seg(p, .2, .6); t2.style.opacity = seg(p, .5, 1); });

  drawA(jStaff, seg(jd, .4, 1)); jStaff.style.opacity = 1 - seg(S.tf, .45, .7);
  A.forEach((a, i) => {
    armEls[i].setAttribute('d', `M${f2(a[0])} ${f2(a[1])}C${f2(a[2])} ${f2(a[3])} ${f2(a[4])} ${f2(a[5])} ${f2(a[6])} ${f2(a[7])}`);
    handEls[i].setAttribute('d', circD(a[6], a[7], 5, 0, TAU, 16));
    drawA(armEls[i], seg(jd, .3, 1)); drawA(handEls[i], seg(jd, .6, 1));
  });
  let face = 'neutral', mouth = 'neutral';
  if (S.greed > .5) { face = 'greed'; mouth = 'smirk'; }
  if (S.wish > .12 && S.wish < .8 && S.tf <= 0) mouth = Math.sin(now * 15) > 0 ? 'talk' : 'smirk';
  if (S.tf > .75) { face = 'triumph'; mouth = 'grin'; }
  if (S.b6 > .4) { face = 'shock'; mouth = 'o'; }
  for (const k in faceEls) drawA(faceEls[k], k === face ? jd : 0);
  for (const k in mouthEls) drawA(mouthEls[k], k === mouth ? jd : 0);
  glint.forEach(g => g.style.opacity = face === 'greed' ? .5 + .5 * Math.sin(now * 5) : 0);
  // transformation: beam, swirl, glow, smoke tail
  const toW = (lx, ly) => [wx + lx * js, wy + (ly + 90) * js];
  const gh = [gx + 54 * gs, gy - 12 * gs], jc = toW(0, -140);
  const beamK = seg(S.tf, 0, .28);
  if (beamK > 0 && S.tf < .5) {
    const bl = new Line(Array.from({ length: 41 }, (_, i) => { const u = i / 40; return [lerp(gh[0], jc[0], u), lerp(gh[1], jc[1], u) - 120 * Math.sin(Math.PI * u)]; }));
    beamEl.setAttribute('d', bl.d(seg(S.tf, .28, .45), beamK));
  } else beamEl.setAttribute('d', '');
  const sw = Math.sin(Math.PI * seg(S.tf, .2, .95));
  swirlEls.forEach((e, i) => {
    const c = toW(0, -110 + i * 40);
    e.setAttribute('d', sw > .01 ? circD(c[0], c[1], (90 + i * 10) * js, now * (2.4 + i * .7) + i * 2, 3.6, 48, 24 * js, -.12 + i * .1) : '');
    e.style.opacity = sw * .8;
  });
  const glowK = Math.max(sw * .5, Math.sin(Math.PI * seg(S.b6, 0, .42)) * .6) * (1 - suck);
  const jcg = toW(0, -130);
  jGlow.setAttribute('cx', f2(jcg[0])); jGlow.setAttribute('cy', f2(jcg[1])); jGlow.setAttribute('r', f2(110 * js));
  jGlow.style.opacity = glowK * .35;
  const tailK = seg(S.tf, .5, .9);
  if (tailK > 0 && S.b6 < .99) {
    const t0 = toW(0, -40);
    const end = suck > 0 ? [lerp(jx + 20, PL_SPOUT[0], suck), lerp(JY - 10, PL_SPOUT[1], suck)] : [jx + 26, JY - 30];
    let d = '';
    for (let i = 0; i <= 30; i++) {
      const u = i / 30 * tailK, x = lerp(t0[0], end[0], u) + 18 * Math.sin(u * 5 + now * 2) * (1 - u * .5), y = lerp(t0[1], end[1], u);
      d += (i ? 'L' : 'M') + f2(x) + ' ' + f2(y);
    }
    jTail.setAttribute('d', d);
  } else jTail.setAttribute('d', '');
  // the rules arrive: cuffs snap on, then the lamp pulls him in
  const cuffK = seg(S.b6, .22, .32);
  A.forEach((a, i) => {
    const h = toW(a[6], a[7]);
    cuffEls[i].setAttribute('d', cuffK > 0 && S.b6 < .99 ? circD(h[0], h[1], 10 * js, -Math.PI / 2, TAU * cuffK, 24) : '');
  });
  const fl = seg(S.b6, .3, .44);
  const hc0 = toW(A[0][6], A[0][7]);
  cuffFlash.setAttribute('cx', f2(hc0[0])); cuffFlash.setAttribute('cy', f2(hc0[1])); cuffFlash.setAttribute('r', f2(10 + 60 * fl));
  cuffFlash.style.opacity = fl > 0 && fl < 1 ? (1 - fl) : 0;
  // speech bubble
  gBub.style.opacity = seg(S.wish, 0, .25) * (1 - seg(S.tf, 0, .2));
  bubEl.setAttribute('d', bubL.d(0, E.inOut(seg(S.wish, 0, .35))));
  bubT.style.opacity = seg(S.wish, .25, .45);
  // the trap lamp (with a rattle)
  const rat = Math.sin(Math.PI * S.rattle) * Math.sin(now * 38) * 7;
  placeG(gPL, PLX, PLY, PLS, rat); gPL.style.opacity = lo;
  plEls.forEach((e, i) => drawA(e, seg(S.b6, .44 + i * .02, .56 + i * .02)));
  const pf = S.rattle;
  if (pf > 0 && pf < 1) {
    let d = '';
    for (let i = 0; i <= 20; i++) { const u = i / 20 * seg(pf, .2, .7); d += (i ? 'L' : 'M') + f2(PL_SPOUT[0] + 30 * u + 6 * Math.sin(u * 9 + now * 3)) + ' ' + f2(PL_SPOUT[1] - 50 * u); }
    puffEl.setAttribute('d', d); puffEl.style.opacity = 1 - seg(pf, .6, 1);
  } else puffEl.setAttribute('d', '');

  // smoke becomes the AI circle; the circle reaches out to real outcomes
  aiCircleEl.setAttribute('d', aiCircle.d(0, S.pcirc));
  show(gAI5, S.aiT > 0 ? 1 : 0);
  ai5Ticks.forEach((t, i) => t.style.opacity = .32 * seg(S.aiT, i / 48 * .6, i / 48 * .6 + .3));
  ai5Guides.forEach((g, i) => {
    const k = E.out(seg(S.aiT, .1 + i * .08, .6 + i * .08)), L = (AIR + 70) * k;
    g.e.setAttribute('x2', f2(GNX + g.d[0] * L)); g.e.setAttribute('y2', f2(GNY + g.d[1] * L));
    g.e.style.opacity = .5 * (1 - S.routes * .5);
  });
  gAI5pt.setAttribute('transform', `translate(${GNX} ${GNY}) scale(${inv.toFixed(4)})`);
  ai5Read.style.opacity = seg(S.aiT, .6, 1) * .85 * (1 - S.routes);
  routes.forEach((r, i) => {
    r.ske.setAttribute('d', r.sk.d(0, E.inOutSine(seg(S.routes, i * .15, .7 + i * .15))));
    r.tre.setAttribute('d', r.tr.d(0, E.inOut(seg(S.traces, i * .15, .7 + i * .15))));
  });
  outEls.forEach(o => o.e.setAttribute('d', o.l.d(0, E.inOutSine(seg(S.outc, o.w[0], o.w[1])))));
  hitRings.forEach((h, i) => { const k = seg(S.outc, .55 + i * .15, .85 + i * .15); h.style.opacity = k > 0 ? (1 - k * .6) : 0; h.setAttribute('r', f2(lerp(16, 40, E.out(k)))); });
  const ae = routes[2].tr.at(.999), ab = routes[2].tr.at(.97);
  gArrow.setAttribute('transform', `translate(${f2(ae[0])} ${f2(ae[1])}) rotate(${f2(Math.atan2(ae[1] - ab[1], ae[0] - ab[0]) * 180 / Math.PI)}) scale(${inv.toFixed(4)})`);
  show(gArrow, S.traces > .99 ? 1 : 0);
  nextT.style.opacity = seg(S.outc, .7, 1);
}

/* ================================================================
   Presenter HUD
   ================================================================ */
const hud = $('#hud');
let hudPinned = false, hudTimer = 0;
function renderHud() {
  let html = `<span>${String(cur).padStart(2, '0')} / ${LAST}</span>`;
  for (const s of [1, 2, 3, 4, 5]) {
    html += '<span class="grp">';
    STEPS.forEach((st, i) => { if (i && st.s === s) html += `<i class="${i === cur ? 'now' : i < cur ? 'done' : ''}" title="${st.n}"></i>`; });
    html += '</span>';
  }
  hud.innerHTML = html;
}
function pokeHud() { hud.classList.add('on'); clearTimeout(hudTimer); if (!hudPinned) hudTimer = setTimeout(() => hud.classList.remove('on'), 2200); }

/* ================================================================
   Input
   ================================================================ */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter', 'n', 'N'].includes(k)) { e.preventDefault(); ac(); go(cur + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') jump(0);
  else if (k === 'End') jump(LAST);
  else if (SLIDE_START[k]) jump(SLIDE_START[k]);
  else if (k === 'f' || k === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {} }
  else if (k === 'm' || k === 'M') muted = !muted;
  else if (k === 'h' || k === 'H') { hudPinned = !hudPinned; hud.classList.toggle('on', hudPinned); }
  else if (k === '?' || k === '/') { const h = $('#help'); h.hidden = !h.hidden; }
});
addEventListener('pointerdown', e => { if (e.button === 0) { ac(); go(cur + 1); } });
addEventListener('contextmenu', e => { e.preventDefault(); go(cur - 1); });
addEventListener('mousemove', pokeHud);
addEventListener('resize', resize);

/* ================================================================
   Boot
   ================================================================ */
resize();
const hm = /^#step-(\d+)$/.exec(location.hash);
if (hm) jump(+hm[1]); else renderHud();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  tick(now);
  renderWorld(dt);
  renderType();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { qRect = null; });
requestAnimationFrame(frame);
window.__deck = { go, jump, S, get cur() { return cur; } };
})();
</script>
