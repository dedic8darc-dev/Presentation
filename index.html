<script>
(() => {
'use strict';
/* ================================================================
   Helpers
   ================================================================ */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (v, a, b) => clamp((v - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  linear: t => t,
  in: t => t * t * t,
  out: t => 1 - Math.pow(1 - t, 3),
  outQuart: t => 1 - Math.pow(1 - t, 4),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, str, cls, anchor = 'start') {
  const t = el('text', { x, y, class: cls, 'text-anchor': anchor }, parent);
  t.textContent = str;
  return t;
}
const f2 = n => n.toFixed(2);

/* A polyline we can draw partially: d(t0, t1) returns the path from fraction t0 to t1 of its length. */
class Line {
  constructor(pts) {
    this.p = pts; this.c = [0];
    for (let i = 1; i < pts.length; i++)
      this.c.push(this.c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    this.L = this.c[this.c.length - 1];
  }
  at(t) {
    const d = clamp(t) * this.L, c = this.c;
    let lo = 0, hi = c.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= d) lo = m; else hi = m; }
    const k = c[hi] - c[lo] ? (d - c[lo]) / (c[hi] - c[lo]) : 0;
    const a = this.p[lo], b = this.p[hi];
    return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lo];
  }
  d(t0, t1) {
    if (t1 <= t0 + 1e-5) return '';
    const a = this.at(t0), b = this.at(t1);
    let s = 'M' + f2(a[0]) + ' ' + f2(a[1]);
    for (let i = a[2] + 1; i <= b[2]; i++) s += 'L' + f2(this.p[i][0]) + ' ' + f2(this.p[i][1]);
    return s + 'L' + f2(b[0]) + ' ' + f2(b[1]);
  }
  last() { return this.p[this.p.length - 1]; }
}
/* Catmull-Rom smoothing through hand-placed points. */
function smooth(P, n = 14) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push(P[P.length - 1].slice());
  return out;
}
/* Subtle hand tremor: tiny perpendicular offsets. */
function tremor(pts, amp, seed) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    const n = amp * (Math.sin(i * .37 + seed) * .6 + Math.sin(i * 1.13 + seed * 2.1) * .4);
    return [p[0] - dy / l * n, p[1] + dx / l * n];
  });
}
const circlePts = (cx, cy, r, n = 360, a0 = -Math.PI / 2) =>
  Array.from({ length: n + 1 }, (_, i) => { const a = a0 + TAU * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });

/* ================================================================
   World geometry
   ================================================================ */
const cam = $('#cam');
const G = name => el('g', { id: name }, cam);

/* ---------- Slide 1: the human circle at (0,0) ---------- */
const R = 180, TH0 = -2.2, GAP = .115, HN = 240;
const handPts = [];
for (let i = 0; i < HN; i++) {
  const u = i / (HN - 1), th = TH0 + u * (TAU - GAP);
  const r = R * (1 + .024 * Math.sin(2 * th + .6) + .011 * Math.sin(3 * th + 2.1) + .005 * Math.sin(7 * th + .3))
            - 6.5 * u * u * u + .7 * Math.sin(u * 97);
  handPts.push([r * Math.cos(th) * 1.022, r * Math.sin(th)]);
}
const hand = new Line(handPts);
const handTex = new Line(handPts.map((p, i) => [p[0] + .9 * Math.sin(i * .21), p[1] + .7 * Math.cos(i * .17)]));
// pen speed varies naturally along the stroke
const penF = p => clamp(E.inOutSine(p) + .03 * Math.sin(TAU * p * 3) * Math.sin(Math.PI * p));

// measurements used by the annotations
const cen = handPts.reduce((a, p) => [a[0] + p[0] / HN, a[1] + p[1] / HN], [0, 0]);
const dists = handPts.map(p => Math.hypot(p[0] - cen[0], p[1] - cen[1]));
const Rm = dists.reduce((a, b) => a + b, 0) / HN;
let iMax = 0, iMin = 0;
for (let i = 30; i < HN - 30; i++) { if (dists[i] > dists[iMax] || !iMax) iMax = i; if (dists[i] < dists[iMin] || !iMin) iMin = i; }
const P0 = handPts[0], PN = handPts[HN - 1];
const gapMid = [(P0[0] + PN[0]) / 2, (P0[1] + PN[1]) / 2];
const gapD = Math.hypot(P0[0] - PN[0], P0[1] - PN[1]);
const xs = handPts.map(p => p[0]), ys = handPts.map(p => p[1]);
const bb = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
const bbc = [(bb.x0 + bb.x1) / 2, (bb.y0 + bb.y1) / 2];
const ovality = (bb.x1 - bb.x0) / (bb.y1 - bb.y0);
const dir = i => { const p = handPts[i]; const l = Math.hypot(p[0] - cen[0], p[1] - cen[1]); return [(p[0] - cen[0]) / l, (p[1] - cen[1]) / l]; };

const gHand = G('hand');
const handTexEl = el('path', { class: 'hand-tex' }, gHand);
const handEl = el('path', { class: 'hand' }, gHand);

// click 4: annotations
const gAnn = G('ann');
const idealLine = new Line(circlePts(cen[0], cen[1], Rm, 240, TH0 + .2));
const idealEl = el('path', { class: 'cons dash' }, gAnn);
function radialMark(i, sign) {
  const d = dir(i), p = handPts[i];
  const a = [cen[0] + d[0] * Rm, cen[1] + d[1] * Rm];
  const b = [p[0] + d[0] * 46, p[1] + d[1] * 46];
  const ln = el('line', { class: 'ann', x1: a[0], y1: a[1], x2: a[0], y2: a[1] }, gAnn);
  const dot = el('circle', { class: 'fill-lime', cx: p[0], cy: p[1], r: 2.4 }, gAnn);
  const dv = dists[i] - Rm;
  const t = txt(gAnn, b[0] + d[0] * 10, b[1] + d[1] * 10 + 4, (dv > 0 ? '+' : '−') + Math.abs(dv).toFixed(1), 'mono', d[0] < 0 ? 'end' : 'start');
  return { ln, dot, t, a, b };
}
const mMax = radialMark(iMax), mMin = radialMark(iMin);

  img1.style.opacity = E.inOut(S.im1) * spot(IMG1.x + IMG1.w / 2); img2.style.opacity = E.inOut(S.im2) * spot(IMG2.x + IMG2.w / 2);
  // slide 10 crops and the reviewed option
  crops.forEach(c => { const k = E.out(seg(S.r10, c.win[0], c.win[1])); c.s.style.opacity = k * spot(c.x + 75); c.s.setAttribute('y', f2(c.y + 18 * (1 - k))); });
  drawA(pickEl, S.pick); pickEl.style.opacity = spot(9480);
  // slide 11 outcome ring
  k4ring.style.opacity = seg(S.k4, .8, 1) * .8 * spot(IT[3]);
  h8El.style.opacity = spot(6560); p8El.style.opacity = spot(6880); gP8pt.style.opacity = spot(6880);

  // ---------- slides 12–17 ----------
  G12.forEach(g => { g.e.style.opacity = .9 * seg(S.g12, g.w, g.w + .3) * spot(g.x); });
  goodEl.setAttribute('d', goodL.d(0, S.good12)); goodEl.style.opacity = spot(GOOD.x);
  { const k = E.inOut(S.mv12), cx = lerp(FR_A[0], FR_B[0], k), cy = lerp(FR_A[1], FR_B[1], k), h = lerp(76, 48, k), c = 18;
    let d = '';
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) d += `M${f2(cx + sx * h)} ${f2(cy + sy * (h - c))}L${f2(cx + sx * h)} ${f2(cy + sy * h)}L${f2(cx + sx * (h - c))} ${f2(cy + sy * h)}`;
    frameEl.setAttribute('d', S.fr12 > 0 ? d : ''); frameEl.style.opacity = S.fr12 * spot(cx);
    frameLbl.setAttribute('x', f2(cx)); frameLbl.setAttribute('y', f2(cy - h - 10)); frameLbl.style.opacity = S.fr12 * spot(cx); }
  sigEls.forEach((e, i) => { const t = (now * .55 + i / 3) % 1; e.setAttribute('r', f2(22 + 70 * t)); e.style.opacity = S.sig12 * (1 - t) * .8 * spot(GOOD.x); });
  goodDot.style.opacity = S.sig12 * spot(GOOD.x);
  // slide 15 feed and create button
  const fy0 = PH15[1] - 198 * PS15, fx0 = PH15[0] - 36;
  feedEls.forEach((e, i) => {
    const y = fy0 + ((i * 46 - now * 14) % 230 + 230) % 230 - 30;
    e.setAttribute('d', rr(fx0, y, fx0 + 72, y + 36, 4)); e.style.opacity = seg(S.ph15, .6, 1) * spot(PH15[0]);
  });
  plusG.setAttribute('transform', `translate(${f2(PH15[0] + 22)} ${f2(PH15[1] - 36)}) scale(${(inv * lerp(.4, 1, E.out(S.plus15))).toFixed(4)})`);
  plusG.style.opacity = S.plus15 * spot(PH15[0]);
  // slide 16 nodes and the flow between them
  idea16El.setAttribute('d', idea16.d(0, penF(S.n1))); idea16El.style.opacity = spot(N16.idea[0]);
  ai16El.setAttribute('d', ai16.d(0, S.n2)); ai16El.style.opacity = spot(N16.ai[0]);
  ai16pt.setAttribute('transform', `translate(${N16.ai[0]} ${N16.ai[1]}) scale(${inv.toFixed(4)})`); ai16pt.style.opacity = seg(S.n2, .3, .6) * spot(N16.ai[0]);
  flowEls.forEach((e, i) => { const p = link16[i].at((now * .4 + i * .33) % 1); e.setAttribute('cx', f2(p[0])); e.setAttribute('cy', f2(p[1])); e.style.opacity = seg(S.lk16, .7, 1) * spot(16200); });
  you16.style.opacity = seg(S.lk16, .75, 1) * spot(16200);
  // slide 17 the closing circle
  fin17El.setAttribute('d', fin17.d(0, penF(S.fin17)));
  beyond17El.setAttribute('d', beyond17.d(0, E.inOutSine(S.bey17)));
  fin17dot.style.opacity = seg(S.bey17, .95, 1);
  // slide 18 thank you
  tkLinkEl.setAttribute('d', tkLink.d(0, S.tkl));
  tkHandEl.setAttribute('d', tkHand.d(0, S.tk));
  tkAIEl.setAttribute('d', tkAI.d(0, S.tk));
  tkAIGlow.setAttribute('d', S.tk > 0 && S.tk < 1 ? tkAI.d(Math.max(0, S.tk - .12), S.tk) : '');
  [tkHand, tkAI].forEach((l, i) => { const h = l.at(S.tk); tkHeads[i].setAttribute('transform', `translate(${f2(h[0])} ${f2(h[1])}) scale(${inv.toFixed(4)})`); show(tkHeads[i], S.tk > 0 && S.tk < 1 ? 1 : 0); });
  tkFlash.setAttribute('r', f2(6 + 120 * S.tkc)); tkFlash.style.opacity = S.tkc > 0 && S.tkc < 1 ? 1 - S.tkc : 0;
  tkRead.style.opacity = seg(S.tkc, .1, .3) * (1 - seg(S.tki, .2, .5)) * .9;
  gTk.setAttribute('transform', `translate(${TC[0]} ${TC[1]}) rotate(${f2(now * 4 % 360)})`);
  tkTicks.forEach((t, i) => t.style.opacity = .3 * seg(S.tki, i / 60 * .6, i / 60 * .6 + .3));
  const oa = now * .5;
  tkOrbit.setAttribute('cx', f2(TC[0] + (TR18 + 30) * Math.cos(oa))); tkOrbit.setAttribute('cy', f2(TC[1] + (TR18 + 30) * Math.sin(oa)));
  tkOrbit.style.opacity = seg(S.tki, .8, 1);
  TK_INFO.forEach(o => { const k = seg(S.tki, o.win[0], o.win[1]); o.e.style.opacity = k; o.e.setAttribute('transform', `translate(0 ${f2((1 - E.out(k)) * 10)})`); });
  tkRuleEl.setAttribute('d', tkRule.d(.5 - .5 * seg(S.tki, .35, .6), .5 + .5 * seg(S.tki, .35, .6)));
}

/* ================================================================
   Presenter HUD
   ================================================================ */
const hud = $('#hud');
let hudPinned = false, hudTimer = 0;
function renderHud() {
  let html = `<span>${String(cur).padStart(2, '0')} / ${LAST}</span>`;
  for (let s = 1; s <= 18; s++) {
    html += '<span class="grp">';
    STEPS.forEach((st, i) => { if (i && st.s === s) html += `<i class="${i === cur ? 'now' : i < cur ? 'done' : ''}" title="${st.n}"></i>`; });
    html += '</span>';
  }
  hud.innerHTML = html;
}
function pokeHud() { hud.classList.add('on'); clearTimeout(hudTimer); if (!hudPinned) hudTimer = setTimeout(() => hud.classList.remove('on'), 2200); }

/* ================================================================
   Input
   ================================================================ */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter', 'n', 'N'].includes(k)) { e.preventDefault(); ac(); go(cur + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') jump(0);
  else if (k === 'End') jump(LAST);
  else if (SLIDE_START[k]) jump(SLIDE_START[k]);
  else if (k === 'f' || k === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {} }
  else if (k === 'm' || k === 'M') muted = !muted;
  else if (k === 'h' || k === 'H') { hudPinned = !hudPinned; hud.classList.toggle('on', hudPinned); }
  else if (k === '?' || k === '/') { const h = $('#help'); h.hidden = !h.hidden; }
  else if (k === 's' || k === 'S') { const h = $('#notes'); h.hidden = !h.hidden; renderNotes(); }
});
addEventListener('pointerdown', e => { if (e.button === 0) { ac(); go(cur + 1); } });
addEventListener('contextmenu', e => { e.preventDefault(); go(cur - 1); });
addEventListener('mousemove', pokeHud);
addEventListener('resize', resize);

/* ================================================================
   Boot
   ================================================================ */
resize();
const hm = /^#step-(\d+)$/.exec(location.hash);
if (hm) jump(+hm[1]); else renderHud();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  tick(now);
  renderWorld(dt);
  renderType();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { qRect = null; });
requestAnimationFrame(frame);
window.__deck = { go, jump, S, get cur() { return cur; } };
})();
</script>
